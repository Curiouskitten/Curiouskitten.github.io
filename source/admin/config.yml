backend:
  name: github
  repo: Curiouskitten/Curiouskitten.github.io
  branch: main
  # base_url: https://YOUR_VERCEL_DOMAIN.vercel.app # Please replace this with your actual Vercel domain later
  # base_url: https://api.netlify.com
  base_url: https://curiouskitten-github-io.vercel.app
  auth_endpoint: api/auth
  site_domain: curiouskitten-github-io.vercel.app

media_folder: "source/images" # Media files will be stored in the repo under source/images
public_folder: "/images" # The src attribute for uploaded media will begin with /images

collections:
  - name: "blog"
    label: "Blog"
    folder: "source/_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "post"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Categories", name: "categories", widget: "list", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
